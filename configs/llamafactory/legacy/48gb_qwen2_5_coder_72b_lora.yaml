### Model
model_name_or_path: /models/qwen/Qwen2.5-Coder-72B-Instruct
trust_remote_code: true

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
deepspeed: configs/deepspeed/ds_z3_b200.json

### Dataset
dataset: aegislm_security_sft
dataset_dir: data
template: qwen
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 16

### Output
output_dir: adapters/aegislm-qwen2_5-coder-72b-lora
logging_dir: runs/aegislm-qwen2_5-coder-72b-lora
overwrite_output_dir: true
save_strategy: steps
save_steps: 100
save_total_limit: 3
plot_loss: true

### Train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0001
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
fp16: false
gradient_checkpointing: true
ddp_timeout: 180000000

### Logging
logging_steps: 10
report_to: wandb
run_name: aegislm-security-sft-qwen2_5-coder-72b-legacy-lora

[project]
name = "aegislm"
version = "0.1.0"
description = "LLM fine-tuning and model development project for security analysis research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=2.16.0,<=4.0.0",
    "hf-transfer>=0.1.9,<1",
    "huggingface-hub>=1,<2",
    "jsonschema>=4,<5",
    "torchao>=0.15.0",
    "transformers>=4.55.0,<=5.6.0,!=4.57.0",
    "wandb>=0.28.0",
]
keywords = ["llm", "fine-tuning", "security", "malware-analysis", "model-development"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "ruff>=0.15.16",
    "types-jsonschema>=4.26.0.20260518",
]
training = [
    "accelerate>=1.3.0,<=1.11.0",
    "deepspeed>=0.19.2,<0.20",
    "llamafactory",
    "peft>=0.18.0,<=0.18.1",
    "trl>=0.18.0,<=0.24.0",
]

[tool.uv.sources]
llamafactory = { path = "LLaMA-Factory", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
exclude = [
    ".venv",
    "LLaMA-Factory",
    "data",
    "model",
    "raw_datasets",
    "artifacts",
    "checkpoints",
    "adapters",
    "models",
    "outputs",
    "saves",
    "runs",
    "wandb",
    "mlruns",
    "unsloth_compiled_cache",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
show_error_codes = true
pretty = true

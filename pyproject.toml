[project]
name = "aegislm"
version = "0.1.0"
description = "LLM fine-tuning and model development project for security analysis research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4,<5",
    "python-dotenv==1.2.3",
    "wandb==0.30.0",
]
keywords = ["llm", "fine-tuning", "security", "malware-analysis", "model-development"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "ruff>=0.15.16",
    "types-jsonschema>=4.26.0.20260518",
]
training = [
    "accelerate==1.14.0",
    "bitsandbytes==0.49.2",
    "datasets==4.3.0",
    "peft==0.19.1",
    "safetensors==0.8.0",
    "torch==2.10.0",
    "transformers==5.5.0",
    "trl==0.24.0",
    "unsloth==2026.6.9",
    "unsloth-zoo==2026.6.7",
]


[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
show_error_codes = true
pretty = true

[project]
name = "aegislm"
version = "0.1.0"
description = "LLM fine-tuning and model development project for security analysis research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4,<5",
]
keywords = ["llm", "fine-tuning", "security", "malware-analysis", "model-development"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "ruff>=0.15.16",
    "types-jsonschema>=4.26.0.20260518",
]


[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
show_error_codes = true
pretty = true
